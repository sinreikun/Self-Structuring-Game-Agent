name: Test and Windows EXE
on:
  push:
    branches: [main]
    paths-ignore:
      - 'updates/**'
      - '.github/release-request.json'
      - 'docs/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:
    inputs:
      validate_model:
        description: Validate real managed model acquisition on Windows
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - id: validation
        run: python -m tools.select_validation
      - if: runner.os == 'Linux' && steps.validation.outputs.scope == 'target-process'
        run: xvfb-run -a python -m pytest -q tests/test_process_selection.py tests/test_process_gui.py --junitxml=test-results.xml
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'target-process'
        run: python -m pytest -q tests/test_process_selection.py tests/test_process_gui.py --junitxml=test-results.xml
      - if: runner.os == 'Linux' && steps.validation.outputs.scope == 'full'
        run: xvfb-run -a python -m pytest -q --junitxml=test-results.xml
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'full'
        run: python -m pytest -q --junitxml=test-results.xml
      - if: steps.validation.outputs.scope == 'full'
        run: python -m selfstruct --self-test
      - if: runner.os == 'Windows'
        run: python tools/build.py
        env:
          SELFSTRUCT_VALIDATION_SCOPE: ${{ steps.validation.outputs.scope }}
      - if: runner.os == 'Windows'
        name: Build stable launcher
        run: python tools/build_launcher.py
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'full'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\dist\SelfStruct.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged smoke test failed: $($proc.ExitCode)" }
      - if: runner.os == 'Windows'
        name: Verify packaged GUI startup
        shell: pwsh
        run: |
          $marker = Join-Path $env:RUNNER_TEMP 'SelfStruct-healthy.txt'
          Remove-Item $marker -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath .\dist\SelfStruct.exe -ArgumentList '--health-marker', $marker -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (!(Test-Path $marker) -and !$proc.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 200
            }
            if (!(Test-Path $marker) -or $proc.HasExited) { throw 'Packaged GUI startup failed' }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - if: runner.os == 'Windows'
        name: Verify packaged stable launcher with native bodies
        shell: pwsh
        run: |
          $body = Join-Path $env:GITHUB_WORKSPACE 'dist/SelfStruct.exe'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/launcher-validation.json'
          $arguments = '--launcher-self-test "{0}" "{1}"' -f $body, $report
          $proc = Start-Process -FilePath .\dist\SelfStructLauncher.exe -ArgumentList $arguments -PassThru
          if (!$proc.WaitForExit(90000)) {
            if (Test-Path $report) { Get-Content $report }
            taskkill /PID $proc.Id /T /F
            python tools/build_launcher.py --diagnostic
            $diagnostic = Start-Process -FilePath .\dist\SelfStructLauncherDiagnostic.exe -ArgumentList $arguments -PassThru -RedirectStandardError .\dist\launcher-stderr.log -RedirectStandardOutput .\dist\launcher-stdout.log
            if (!$diagnostic.WaitForExit(60000)) { taskkill /PID $diagnostic.Id /T /F }
            if (Test-Path $report) { Get-Content $report }
            if (Test-Path .\dist\launcher-stderr.log) { Get-Content .\dist\launcher-stderr.log -Tail 40 }
            throw 'Windowed launcher self-test timed out'
          }
          if (Test-Path $report) { Get-Content $report }
          if ($proc.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged stable launcher validation failed' }
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'full'
        name: Verify packaged background I/O
        shell: pwsh
        run: |
          $targetPython = (Get-Command python).Source
          $targetScript = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/message_window.py'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/window-validation.json'
          $arguments = '--io-self-test --test-window-exe "{0}" --test-window-script "{1}" --self-test-report "{2}"' -f $targetPython, $targetScript, $report
          $proc = Start-Process -FilePath .\dist\SelfStruct.exe -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged background I/O failed' }
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'target-process'
        name: Verify packaged process selection and launcher
        shell: pwsh
        run: |
          $targetPython = (Get-Command python).Source
          $targetScript = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/message_window.py'
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/launcher.py'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/window-validation.json'
          $arguments = '--process-self-test --test-window-exe "{0}" --test-window-script "{1}" --test-launcher-script "{2}" --self-test-report "{3}"' -f $targetPython, $targetScript, $launcher, $report
          $proc = Start-Process -FilePath .\dist\SelfStruct.exe -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged process selection failed' }
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'full' && (github.event_name == 'push' || inputs.validate_model)
        name: Verify real managed inference
        shell: pwsh
        run: python tools/check_managed_inference.py --root "$env:RUNNER_TEMP/selfstruct-model-check" --report dist/inference-validation.json
      - if: runner.os == 'Windows' && steps.validation.outputs.scope == 'target-process'
        name: Reuse verified unchanged inference baseline
        run: python -m tools.select_validation --reuse-report dist/inference-validation.json
      - if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SelfStruct-Windows-x64
          path: |
            dist/SelfStruct.exe
            dist/SelfStructLauncher.exe
            dist/launcher-validation.json
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.txt
            dist/build-info.json
            dist/inference-validation.json
            dist/window-validation.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
