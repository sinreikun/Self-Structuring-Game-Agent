name: Test and Windows EXE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q --junitxml=test-results.xml
      - if: runner.os == 'Windows'
        run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m selfstruct --self-test
      - if: runner.os == 'Windows'
        run: python tools/build.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath .\dist\SelfStruct.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Packaged smoke test failed: $($proc.ExitCode)" }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SelfStruct-Windows-x64
          path: |
            dist/SelfStruct.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.txt
            dist/build-info.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
